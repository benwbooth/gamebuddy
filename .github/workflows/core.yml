name: Rust core and services
# Manual only until the Actions quota resets on 2026-11-01; restore
# `on: [push, pull_request]` then. Run it with: gh workflow run core.yml
on: [workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --locked -p gamebuddy-core -p gamebuddy-services -p gamebuddy-cli -p gamebuddy-overlay
      - run: cargo clippy --locked -p gamebuddy-core -p gamebuddy-services -p gamebuddy-cli -p gamebuddy-overlay --all-targets -- -D warnings
      - run: cargo fmt --all --check
