[workspace]
members = ["crates/gamebuddy-core", "crates/gamebuddy-services", "crates/gamebuddy-cli", "crates/gamebuddy-app", "crates/gamebuddy-overlay"]
default-members = ["crates/gamebuddy-app", "crates/gamebuddy-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
schemars = "1.2"

[profile.dev]
debug = 1

# The continuously running image matcher must remain usable in dev builds.
[profile.dev.package.gamebuddy-core]
opt-level = 3

# Live ultrawide capture decodes/resizes several million pixels per frame.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
