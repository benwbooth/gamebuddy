[workspace]
members = ["crates/gamebuddy-core", "crates/gamebuddy-services", "crates/gamebuddy-cli", "crates/gamebuddy-app", "crates/gamebuddy-overlay", "crates/gamebuddy-compositor"]
default-members = ["crates/gamebuddy-app", "crates/gamebuddy-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
schemars = "1.2"

[profile.dev]
debug = false
strip = true

# The continuously running image matcher must remain usable in dev builds.
[profile.dev.package.gamebuddy-core]
opt-level = 3

# XComposite converts millions of game pixels on every capture. Keep that
# conversion optimized in the development build used by the launcher too.
[profile.dev.package.gamebuddy-overlay]
opt-level = 3

# JPEG publication and Qt snapshot serialization run continuously during play.
# Optimize their generic image/serde code at the call sites, not only in deps.
[profile.dev.package.gamebuddy-services]
opt-level = 2
[profile.dev.package.gamebuddy-app]
opt-level = 2

# Live ultrawide capture decodes/resizes several million pixels per frame.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3

# Smithay 0.7.0 with GameBuddy's Xwayland frame patch (keeps ARGB overlays
# transparent). See vendor/smithay/src/xwayland/xwm/mod.rs, "GameBuddy patch".
[patch.crates-io]
smithay = { path = "vendor/smithay" }
