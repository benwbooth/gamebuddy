[package]
name = "gamebuddy-compositor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
image.workspace = true
tracing = "0.1"
x11rb = { version = "0.13", features = ["shape", "xfixes"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["xkbcommon"] }
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-egl = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.smithay]
version = "0.7"
default-features = false
features = ["backend_winit", "backend_egl", "backend_drm", "renderer_gl", "desktop", "wayland_frontend", "xwayland"]
