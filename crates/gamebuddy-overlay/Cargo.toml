[package]
name = "gamebuddy-overlay"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
tempfile = "3"
gamebuddy-services = { path = "../gamebuddy-services" }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["composite", "xtest", "xfixes", "res", "randr"] }
wayland-client = "0.31"
libc = "0.2"
gamebuddy-compositor = { path = "../gamebuddy-compositor" }

[dev-dependencies]
base64 = "0.22"
gamebuddy-core = { path = "../gamebuddy-core" }
tiny_http = "0.12"
