[package]
name = "gamebuddy-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "gamebuddy"
path = "src/main.rs"

[dependencies]
gamebuddy-overlay = { path = "../gamebuddy-overlay" }
gamebuddy-core = { path = "../gamebuddy-core" }
gamebuddy-services = { path = "../gamebuddy-services" }
anyhow.workspace = true
serde_json.workspace = true
cxx = "1"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
url.workspace = true
image.workspace = true

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }
