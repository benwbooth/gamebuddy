<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; connect-src wss://generativelanguage.googleapis.com"></head><body><script>
// Gemini Live: 16 kHz PCM microphone in, 24 kHz PCM speech out, one
// WebSocket. Server-side voice activity detection handles turn-taking and
// barge-in; Gemini calls GameBuddy's tools and watches streamed frames.
(() => {
  const URL_BASE='wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=';
  let ws=null,config=null,generation=0,resumeHandle=null,reconnects=0,ready=false,stopping=false;
  let mic=null,micContext=null,micNodes=null,captureGeneration=0;
  let speaker=null,playAt=0,sources=new Set(),outputMuted=false,speaking=false,meterTimer=null;
  let inputText='',outputText='',pendingTools=new Map(),framesSent=0,bookkeeping=false,quietTurn=false;
  let extendedThinking=false,workPending=false;
  const silent=()=>bookkeeping;
  const emit=(type,value)=>console.info('GAMEBUDDY_GEMINI '+JSON.stringify({type,value,at:Date.now()}));
  const send=message=>{if(ws?.readyState===WebSocket.OPEN&&ready)ws.send(JSON.stringify(message))};
  function base64(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s)}
  function stopPlayback(){for(const s of sources){s.onended=null;try{s.stop()}catch{}}sources.clear();playAt=0;setSpeaking(false)}
  function setSpeaking(value){if(value!==speaking){speaking=value;emit('output-active',value)}}
  function setWorkPending(value){if(value!==workPending){workPending=value;emit('work-pending',value)}}
  function finishInteraction(){
    setWorkPending(false);
    if(bookkeeping){bookkeeping=false;if(outputText.trim())emit('muted-reply',outputText.trim());outputText='';emit('bookkeeping-done',true)}
  }
  function play(data){
    if(outputMuted||silent()||quietTurn||!speaker)return;
    const raw=atob(data),samples=new Float32Array(raw.length>>1);
    for(let i=0;i<samples.length;i++){let v=raw.charCodeAt(2*i)|(raw.charCodeAt(2*i+1)<<8);if(v>=32768)v-=65536;samples[i]=v/32768}
    const buffer=speaker.createBuffer(1,samples.length,24000);buffer.copyToChannel(samples,0);
    const source=speaker.createBufferSource();source.buffer=buffer;source.connect(speaker.destination);
    playAt=Math.max(playAt,speaker.currentTime+0.03);source.start(playAt);playAt+=buffer.duration;
    sources.add(source);source.onended=()=>{sources.delete(source);if(!sources.size)setSpeaking(false)};
    setSpeaking(true);
  }
  function message(m){
    if(m.setupComplete){ready=true;reconnects=0;emit('ready',true);return}
    if(m.sessionResumptionUpdate?.resumable&&m.sessionResumptionUpdate.newHandle)resumeHandle=m.sessionResumptionUpdate.newHandle;
    if(m.goAway){emit('trace','go-away '+(m.goAway.timeLeft||''));reconnect();return}
    const c=m.serverContent||{};
    const status=m.interactionStatus||m.interaction_status||c.interactionStatus||c.interaction_status;
    if(status){emit('interaction-status',status);if(status==='IN_PROGRESS')setWorkPending(true)}
    // The player's words reach GameBuddy before the tools they prompted.
    if(m.toolCall&&inputText.trim()){emit('input-final',inputText.trim());inputText=''}
    if(m.toolCall){setWorkPending(true);for(const call of m.toolCall.functionCalls||[]){if(pendingTools.has(call.id))continue;pendingTools.set(call.id,call.name);emit('tool-call',{id:call.id,name:call.name,args:call.args||{}})}}
    if(m.toolCallCancellation){for(const id of m.toolCallCancellation.ids||[]){pendingTools.delete(id);emit('tool-cancel',id)}}
    if(c.interrupted){stopPlayback();if(outputText)emit('output-final',outputText+' …');outputText='';emit('interrupted',true)}
    if(c.inputTranscription?.text){if(silent())outputText='';bookkeeping=false;quietTurn=false;setWorkPending(true);inputText+=c.inputTranscription.text;emit('input-text',inputText)}
    // A model that decides not to talk sometimes says a placeholder such
    // as "<no speech>{pause}" out loud; cut it off and drop the rest of the turn.
    if(c.outputTranscription?.text&&!outputText.trim()&&/^\s*[<{\[(]|no speech|\{pause\}/i.test(c.outputTranscription.text)){quietTurn=true;stopPlayback();emit('quiet-turn',c.outputTranscription.text)}
    if(c.outputTranscription?.text&&silent())outputText+=c.outputTranscription.text;
    if(c.outputTranscription?.text&&!silent()&&!quietTurn){
      if(inputText.trim()){emit('input-final',inputText.trim());inputText=''}
      outputText+=c.outputTranscription.text;emit('caption',outputText)}
    for(const part of c.modelTurn?.parts||[])if(part.inlineData?.data)play(part.inlineData.data);
    if(c.turnComplete||c.generationComplete){
      if(inputText.trim()){emit('input-final',inputText.trim());inputText=''}
      if(c.turnComplete&&quietTurn){quietTurn=false;outputText=''}
      if(c.turnComplete&&outputText.trim()&&!silent()){emit('output-final',outputText.trim());outputText=''}
    }
    // Extended Thinking can finish a spoken sentence and continue reasoning
    // or call more tools. Only IDLE finishes that interaction, including a
    // silent bookkeeping check. Process every part before releasing it.
    if(!pendingTools.size&&(status==='IDLE'||(!extendedThinking&&c.turnComplete)))finishInteraction();
  }
  function connect(){
    const own=generation;ready=false;
    const setup=JSON.parse(JSON.stringify(config.setup));
    if(resumeHandle)setup.sessionResumption={handle:resumeHandle};
    const socket=new WebSocket(URL_BASE+encodeURIComponent(config.key));ws=socket;
    socket.onopen=()=>{if(own===generation&&ws===socket)socket.send(JSON.stringify({setup}))};
    socket.onmessage=async e=>{if(own!==generation||ws!==socket)return;try{message(JSON.parse(typeof e.data==='string'?e.data:await e.data.text()))}catch(err){emit('trace','bad message '+err.message)}};
    socket.onerror=()=>{if(own===generation&&ws===socket)emit('trace','socket error')};
    socket.onclose=e=>{
      if(own!==generation||ws!==socket||stopping)return;
      ready=false;
      // An exhausted quota or key/policy error will not succeed on retry.
      if(/quota|exceeded|resource.?exhausted|rate.?limit|billing/i.test(e.reason||'')){emit('quota',e.reason);return}
      // A model without Google Search support still works without it.
      const tools=config.setup.tools||[];
      if(/search|tool/i.test(e.reason||'')&&tools.some(t=>t.googleSearch)){config.setup.tools=tools.filter(t=>!t.googleSearch);emit('trace','retrying without Google Search: '+e.reason);reconnect();return}
      if(/language/i.test(e.reason||'')&&config.setup.generationConfig?.speechConfig?.languageCode){delete config.setup.generationConfig.speechConfig.languageCode;emit('trace','retrying without a language code: '+e.reason);reconnect();return}
      // Likewise a model that does not accept a thinking budget.
      if(!extendedThinking&&/think/i.test(e.reason||'')&&config.setup.generationConfig?.thinkingConfig){delete config.setup.generationConfig.thinkingConfig;emit('trace','retrying without a thinking budget: '+e.reason);reconnect();return}
      if([1007,1008].includes(e.code)||reconnects>=3){emit('error',e.reason||('Gemini Live closed ('+e.code+')'));return}
      reconnect();
    };
  }
  function reconnect(){
    if(!config)return;reconnects++;
    const old=ws;ws=null;ready=false;if(old){old.onclose=null;try{old.close()}catch{}}
    emit('reconnecting',reconnects);setTimeout(()=>{if(config&&!ws)connect()},reconnects>1?1000:0);
  }
  function closeMic(){
    captureGeneration++;
    if(micNodes){micNodes.processor.onaudioprocess=null;micNodes.source.disconnect();micNodes.processor.disconnect();micNodes.zero.disconnect();micNodes=null}
    if(mic){mic.getTracks().forEach(t=>t.stop());mic=null;send({realtimeInput:{audioStreamEnd:true}})}
    if(micContext){micContext.close().catch(()=>{});micContext=null}
    emit('capture',false);
  }
  async function setMicrophone(enabled,deviceName){
    closeMic();if(!enabled||!config)return;
    const request=captureGeneration,stale=()=>request!==captureGeneration||!config;
    const constraints={echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1};
    let stream=null;
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:constraints,video:false});
      if(deviceName){
        const devices=await navigator.mediaDevices.enumerateDevices();
        const selected=devices.find(d=>d.kind==='audioinput'&&(d.label===deviceName||d.label.endsWith(deviceName)));
        if(!selected)throw Error('Selected microphone is unavailable to the voice engine');
        stream.getTracks().forEach(t=>t.stop());
        stream=await navigator.mediaDevices.getUserMedia({audio:{...constraints,deviceId:{exact:selected.deviceId}},video:false});
      }
      if(stale()){stream.getTracks().forEach(t=>t.stop());return}
      // The context resamples the microphone to the 16 kHz Gemini expects.
      const context=new AudioContext({sampleRate:16000});await context.resume();
      const source=context.createMediaStreamSource(stream),processor=context.createScriptProcessor(1024,1,1),zero=context.createGain();
      zero.gain.value=0;source.connect(processor);processor.connect(zero);zero.connect(context.destination);
      processor.onaudioprocess=event=>{
        if(!ready)return;
        const input=event.inputBuffer.getChannelData(0),pcm=new Int16Array(input.length);
        for(let i=0;i<input.length;i++)pcm[i]=Math.max(-32768,Math.min(32767,Math.round(input[i]*32767)));
        send({realtimeInput:{audio:{data:base64(new Uint8Array(pcm.buffer)),mimeType:'audio/pcm;rate=16000'}}});
      };
      mic=stream;micContext=context;micNodes={source,processor,zero};emit('capture',true);
    }catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());if(!stale())emit('microphone-error',e.name+': '+e.message)}
  }
  function stop(){
    generation++;stopping=true;closeMic();stopPlayback();pendingTools.clear();inputText='';outputText='';bookkeeping=false;quietTurn=false;setWorkPending(false);
    if(ws){ws.onclose=null;try{ws.close()}catch{}}ws=null;ready=false;config=null;resumeHandle=null;reconnects=0;
    if(speaker){speaker.close().catch(()=>{});speaker=null}
    clearInterval(meterTimer);meterTimer=null;stopping=false;
  }
  window.gamebuddyGemini={
    async start(session,deviceName,capture){
      stop();
      if(session.error){emit('error',session.error);return}
      config=session;extendedThinking=session.setup.model.endsWith('gemini-3.8-live-extended-thinking');speaker=new AudioContext({sampleRate:24000});await speaker.resume();
      connect();if(capture)await setMicrophone(true,deviceName);
    },
    stop,setMicrophone,
    toolResult(id,response,images=[]){
      const name=pendingTools.get(id);if(!name)return;pendingTools.delete(id);
      if(images.length)send({clientContent:{turns:[{role:'user',parts:[{text:'Images returned by '+name+' (in image_index order). Use the tool result metadata to distinguish the current screenshot, reference maps and historical journal images.'},...images.map(data=>({inlineData:{mimeType:'image/jpeg',data}}))]}],turnComplete:false}});
      send({toolResponse:{functionResponses:[{id,name,response}]}});
    },
    // The current game screen, about once a second, so answers use what the
    // player sees now.
    frame(jpeg){if(ws?.readyState===WebSocket.OPEN&&ready){send({realtimeInput:{video:{data:jpeg,mimeType:'image/jpeg'}}});framesSent++;if(framesSent%30===1)emit('frames',framesSent)}},
    // The exact current screen as a still, attached before a screen or
    // context tool result so position answers come from it.
    still(jpeg){send({clientContent:{turns:[{role:'user',parts:[{text:'Current game screen (newest frame):'},{inlineData:{mimeType:'image/jpeg',data:jpeg}}]}],turnComplete:false}})},
    // Application cues are spoken; context is quiet background.
    cue(text){if(silent())outputText='';bookkeeping=false;setWorkPending(true);send({clientContent:{turns:[{role:'user',parts:[{text:'GameBuddy cue: '+text}]}],turnComplete:true}})},
    context(text){send({clientContent:{turns:[{role:'user',parts:[{text:'Game context: '+text}]}],turnComplete:false}})},
    watch(){if(workPending)return;setWorkPending(true);send({clientContent:{turns:[{role:'user',parts:[{text:'Watch check: the scene just changed.'}]}],turnComplete:true}})},
    // A silent turn: Gemini records what changed (items bought, keys used)
    // with tools; any speech it produces is dropped.
    bookkeep(){if(speaking||silent()||workPending){emit('bookkeeping-done',false);return}bookkeeping=true;setWorkPending(true);send({clientContent:{turns:[{role:'user',parts:[{text:'Bookkeeping check: compare the newest frames with trackable_facts. If an item was bought, found, used up or lost, or a door or spring changed, record it with report_world_state now. Your reply in this turn is not played.'}]}],turnComplete:true}})},
    interrupt(){stopPlayback()},
    muteOutput(muted){outputMuted=muted;if(muted)stopPlayback()}
  };
})();
</script></body></html>
