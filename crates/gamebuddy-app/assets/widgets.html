</style></head><body><div id="widgets"></div><script>
(() => {
  const host=document.getElementById('widgets');
  let layouts={}, locked=false, active=null, latestState=null, pendingMap=null, pendingSpatial=null;
  let mapChoice=null, followMap=true, mapZoom=1, mapScroll={x:0,y:0}, mapGuide=null, mapObserver=null, browsedPlace=null;
  const text=(tag,value,className)=>{const node=document.createElement(tag);node.textContent=value;if(className)node.className=className;return node};
  const bounds=n=>{const r=n.getBoundingClientRect();return [r.x,r.y,r.width,r.height]};
  const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
  // Tooltips must live in this surface too; native Qt popups are not composited.
  const tip=text('aside','','provenance');tip.id='source-provenance';tip.hidden=true;tip.setAttribute('role','tooltip');document.body.append(tip);
  let tipOwner=null, tipTimer=null;
  const urlFor=(raw,at)=>{try{const u=new URL(raw);if(!['https:','http:'].includes(u.protocol)||u.username||u.password)return null;if(at!=null&&['youtube.com','www.youtube.com','youtu.be','www.youtube-nocookie.com'].includes(u.hostname))u.searchParams.set('t',String(Math.floor(at/1000))+'s');return u.href}catch{return null}};
  const time=ms=>{const t=Math.floor(ms/1000);return (t>=3600?Math.floor(t/3600)+':':'')+String(Math.floor(t/60)%60).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
  function stepEvidence(ids){
    const g=latestState?.guide, entries=[],seen=new Set();
    for(const id of ids||[]){const step=g?.steps?.find(s=>s.id===id);if(!step)continue;
      for(const a of step.anchors||[]){const source=g.sources?.find(s=>s.id===a.source_id);if(!source)continue;const key=JSON.stringify(a);if(seen.has(key))continue;seen.add(key);
        entries.push({title:source.title,detail:({youtube:'YouTube walkthrough',video:'Video reference',text:'Text walkthrough'}[source.kind]||'Reference')+(a.start_ms!=null?' · '+time(a.start_ms)+(a.end_ms!=null?'–'+time(a.end_ms):''):'')+(a.section?' · '+a.section:'')+(g.reference_preferences?.some(p=>p.source_id===source.id&&!p.enabled)?' · Disabled reference':''),url:urlFor(source.url,a.start_ms)});
      }
      if(!step.anchors?.length)entries.push({title:step.title,detail:'No reference attached to this step. It may contain player additions or AI suggestions.'});
    }
    return entries.length?entries:[{title:'No reference attached',detail:'Player input or GameBuddy suggestion; no walkthrough source is cited.'}];
  }
  const mapEvidence=m=>m?[{title:m.title,detail:'Reference map · '+(m.credit||'Author not supplied'),url:urlFor(m.source_url)},{title:'Original map image',url:urlFor(m.url)}]:[];
  const placeEvidence=p=>p?[{title:p.label,detail:p.landmarks},...stepEvidence((latestState?.navigation?.map?.bindings||[]).filter(b=>b.place_id===p.id).map(b=>b.step_id))]:[];
  const locationEvidence=()=>{const l=latestState?.navigation?.location;return [{title:l?.status==='reported'?'Player-reported location':'Visual location estimate',detail:(l?.detail||'Location is not established.')+(l?.located_at_ms?' · '+new Date(l.located_at_ms).toISOString():'')},...(l?.reference_step_id?stepEvidence([l.reference_step_id]):[])]};
  function evidence(node,title,entries){node.dataset.evidence=title;node.evidenceEntries=typeof entries==='function'?entries:()=>entries;return node}
  function hideTip(){clearTimeout(tipTimer);tipOwner?.removeAttribute('aria-describedby');tipOwner=null;tip.hidden=true;regions()}
  function showTip(node){if(!node.isConnected||active)return;tipOwner?.removeAttribute('aria-describedby');tipOwner=node;tip.replaceChildren(text('strong',node.dataset.evidence));const entries=node.evidenceEntries();
    for(const entry of entries){const row=text('div','','evidence-entry');row.append(text('div',entry.title||'Source'));if(entry.detail)row.append(text('small',entry.detail));if(entry.url){const a=text('a',entry.url);a.href=entry.url;a.addEventListener('click',e=>{e.preventDefault();console.info('GAMEBUDDY_SOURCE_OPEN '+JSON.stringify(entry.url))});row.append(a)}tip.append(row)}
    tip.hidden=false;const r=node.getBoundingClientRect();tip.style.left=clamp(r.left,8,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=clamp(r.bottom+8,8,innerHeight-tip.offsetHeight-8)+'px';node.setAttribute('aria-describedby',tip.id);regions();console.info('GAMEBUDDY_PROVENANCE '+JSON.stringify({title:node.dataset.evidence,entries,rect:bounds(tip)}));
  }
  document.addEventListener('pointerover',e=>{if(tip.contains(e.target)){clearTimeout(tipTimer);return}const n=e.target.closest('[data-evidence]');if(!n)return;clearTimeout(tipTimer);if(n!==tipOwner)tipTimer=setTimeout(()=>showTip(n),250)});
  document.addEventListener('pointerout',e=>{const n=e.target.closest('[data-evidence]');if((n&&!n.contains(e.relatedTarget))||(tip.contains(e.target)&&!tip.contains(e.relatedTarget))){clearTimeout(tipTimer);tipTimer=setTimeout(hideTip,160)}});
  document.addEventListener('focusin',e=>{const n=e.target.closest('[data-evidence]');if(n)showTip(n)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});
  // Native <select> popups create another Qt window outside the Gamescope
  // overlay plane. Keep menus in the same HTML surface as the widget.
  function picker(label, options, onChange, upward=false){
    const root=text('div','','picker'+(upward?' upward':'')),button=text('button',''),menu=text('div','','picker-menu');
    button.type='button';button.setAttribute('aria-label',label);button.setAttribute('aria-haspopup','listbox');button.setAttribute('aria-expanded','false');
    menu.hidden=true;menu.setAttribute('role','listbox');menu.setAttribute('aria-label',label+' choices');root.append(button,menu);
    function close(){menu.hidden=true;root.classList.remove('open');button.setAttribute('aria-expanded','false');if(latestState)queueMicrotask(()=>window.gamebuddy.render(latestState))}
    button.addEventListener('click',()=>{if(!menu.hidden){close();return}menu.hidden=false;root.classList.add('open');button.setAttribute('aria-expanded','true');menu.querySelector('[aria-selected=true]')?.scrollIntoView({block:'nearest'});requestAnimationFrame(()=>console.info('GAMEBUDDY_PICKER '+JSON.stringify({label,options:[...menu.children].map(n=>({id:n.dataset.value,rect:bounds(n)}))})))});
    root.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close()}});
    for(const option of options){const row=text('button',option.label);row.type='button';row.dataset.value=option.id;row.setAttribute('role','option');row.addEventListener('click',()=>{onChange(option.id);close()});menu.append(row)}
    return {node:root,updateOptions(next){options=next;for(const row of menu.children)row.textContent=options.find(o=>o.id===row.dataset.value)?.label||row.textContent},set(value){button.textContent=(options.find(o=>o.id===value)?.label||'Choose…')+' ▾';for(const row of menu.children)row.setAttribute('aria-selected',String(row.dataset.value===value));button.disabled=!options.length}};
  }
  /* WIDGET_GESTURES_SCRIPT */
  /* GUIDE_LIBRARY_SCRIPT */
  /* WALKTHROUGH_SCRIPT */
  function fitBox(box,id){const outline=id==='walkthrough-outline',width=clamp(box.width,Math.min(outline?300:230,innerWidth),innerWidth),height=box.collapsed?64:clamp(box.height,Math.min(outline?360:130,innerHeight),innerHeight);return {...box,x:clamp(box.x,0,innerWidth-width),y:clamp(box.y,0,innerHeight-height),width,height}}
  function regions(){console.info('GAMEBUDDY_REGIONS '+JSON.stringify([...host.querySelectorAll('.widget'),...(!tip.hidden?[tip]:[])].map(n=>{const r=n.getBoundingClientRect();return [r.x,r.y,r.width,r.height]})))}
  // Replacing a scrolling viewport drops Chromium's native scrollbar capture
  // and trackpad inertia. Keep only the actively used widget mounted until the
  // gesture ends; other widgets still receive current observations normally.
  let scrollingWidget=null,scrollSettle=null;
  const scrollPointers=new Set();
  function settleScroll(){
    clearTimeout(scrollSettle);
    if(scrollPointers.size)return;
    // Chromium can keep its native scroll target latched across short pauses.
    // Replacing it after 250 ms delivers later wheel events but loses scrolling.
    scrollSettle=setTimeout(()=>{scrollingWidget=null;if(latestState)window.gamebuddy.render(latestState)},1000);
  }
  document.addEventListener('wheel',event=>{
    const widget=event.target.closest('.widget');if(!widget)return;
    scrollingWidget=widget;settleScroll();
  },{passive:true,capture:true});
  document.addEventListener('pointerdown',event=>{
    if(event.target.closest('button,a,input,select,summary'))return;
    const body=event.target.closest('.body');if(!body)return;
    scrollingWidget=body.closest('.widget');scrollPointers.add(event.pointerId);clearTimeout(scrollSettle);
  },true);
  for(const type of ['pointerup','pointercancel','lostpointercapture'])document.addEventListener(type,event=>{
    if(scrollPointers.delete(event.pointerId))settleScroll();
  },true);
  window.addEventListener('blur',()=>{scrollPointers.clear();settleScroll()});
  function save(){console.info('GAMEBUDDY_LAYOUT '+JSON.stringify(layouts));regions()}
  function place(node,box){box=fitBox(box,node.dataset.widgetId);node.style.left=box.x+'px';node.style.top=box.y+'px';node.style.width=box.width+'px';node.style.height=box.height+'px'}
  function begin(event,node,id,resize){if(locked)return;hideTip();event.preventDefault();const b=node.getBoundingClientRect();active={node,id,resize,x:event.clientX,y:event.clientY,box:{...layouts[id],x:b.x,y:b.y,width:b.width,height:b.height}};event.currentTarget.setPointerCapture(event.pointerId)}
  document.addEventListener('pointermove',e=>{if(!active)return;const a=active,dx=e.clientX-a.x,dy=e.clientY-a.y;let box={...a.box};if(a.resize){box.width=clamp(box.width+dx,230,innerWidth-box.x);box.height=clamp(box.height+dy,130,innerHeight-box.y)}else{box.x+=dx;box.y+=dy}box=fitBox(box,a.id);layouts[a.id]=box;place(a.node,box)});
  function finish(){if(active){active=null;save();if(latestState)window.gamebuddy.render(latestState)}}
  document.addEventListener('pointerup',finish);
  document.addEventListener('pointercancel',finish);
  document.addEventListener('lostpointercapture',finish);
  addEventListener('blur',finish);
  addEventListener('resize',()=>{finish();for(const n of host.querySelectorAll('.widget')){const r=n.getBoundingClientRect();place(n,{...layouts[n.dataset.widgetId],x:r.x,y:r.y,width:r.width,height:r.height})}regions()});
  function mapStructure(c){return JSON.stringify([c.guide_id,c.map?.maps,c.map?.places,c.map?.locations?.map(({current,...p})=>p)])}
  // Keep the map surface, image, menus and scroll viewport mounted across observations.
  function mountLocationMap(body,initial,titles){
        body.classList.add('map-panel');let c=initial,map=c.map||{},locations=[];const maps=map.maps||[],places=map.places||[];
        const locationOptions=()=>locations.map(p=>({id:p.id,label:(p.current?'▶ You are here · ':'')+p.label+(p.area_reference?' · area map':!p.map_id?' · map unavailable':'')}));
        locations=map.locations||maps.map(m=>({id:'map:'+m.id,map_id:m.id,label:m.title}));
        let loadedAsset=null,framingKey='';
        if(mapGuide!==c.guide_id){mapGuide=c.guide_id;mapChoice=null;followMap=true;mapZoom=1;mapScroll={x:0,y:0};browsedPlace=null}
        const status=evidence(text('div','','map-status'),'Location evidence',locationEvidence);body.append(status);
