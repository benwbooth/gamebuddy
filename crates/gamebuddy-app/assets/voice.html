            const input=event.inputBuffer.getChannelData(0),output=event.outputBuffer.getChannelData(0);
            output.fill(0);
            const blockStart=inputSample;inputSample+=input.length;
            let energy=0;for(const value of input)energy+=value*value;
            const speaking=energy/input.length>0.000004;
            if(speaking)lastIncomingAudio=Date.now();
            if(conversational){
              clear();
              if(!updatePlayback())return;
              if(speaking&&captionAudioStart===null)captionAudioStart=blockStart;
              for(let i=0;i<output.length;i++){output[i]=input[i];captionsAt(blockStart+i,(event.playbackTime||audio.currentTime||0)+i/audio.sampleRate)}
              return;
            }
            if(!approved||outputMuted||replyUntil<=Date.now()){clear();return}
            if(speaking&&captionAudioStart===null)captionAudioStart=blockStart;
            // Do not queue seconds of transport silence/comfort noise while
            // the player talks. Keep pre-roll for quiet consonant onsets.
            const waiting=!size&&!speaking || playerSpeaking&&!speaking&&quietSamples>=preRoll.length;
            if(waiting){for(const value of input){preRoll[preAt]=value;preAt=(preAt+1)%preRoll.length;preSize=Math.min(preRoll.length,preSize+1)}}
            else {
              for(let i=0;i<preSize;i++)append(preRoll[(preAt-preSize+i+preRoll.length)%preRoll.length],blockStart-preSize+i);preSize=0;
              for(let i=0;i<input.length;i++)append(input[i],blockStart+i);
              quietSamples=speaking?0:quietSamples+input.length;
            }
            if(!playerSpeaking){for(let i=0;i<output.length&&size;i++){output[i]=samples[read];captionsAt(sampleTimes[read],(event.playbackTime||audio.currentTime||0)+i/audio.sampleRate);read=(read+1)%samples.length;size--}}
          };
          source.connect(processor);processor.connect(analyser);analyser.connect(gain);gain.connect(audio.destination);
          outputMeter={source,processor,analyser,zero:gain,clear,data:new Float32Array(analyser.fftSize)};
          // Chromium needs an HTML consumer to keep the remote track decoded.
          // Playback itself uses the queue so speech during input is retained.
          receiver.srcObject=stream;receiver.muted=true;updatePlayback();
          receiver.play().catch(err=>{if(own===generation)emit('error',err.message)});
        };
        pc.onconnectionstatechange=()=>{if(own===generation)emit('connection',pc.connectionState)};
        if(capture)await setMicrophone(true,deviceName);
        if(own!==generation)return;
        stage='SDP offer';await pc.setLocalDescription(await pc.createOffer());
        if(pc.iceGatheringState!=='complete')await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error('Voice connection setup timed out')),10000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(timeout);resolve()}})});
        if(own===generation)emit('offer',pc.localDescription.sdp);
      }catch(e){if(own===generation){stop();emit('error',stage+': '+e.name+': '+e.message)}}
    },
    async answer(sdp){const pc=peer,own=generation;try{if(pc)await pc.setRemoteDescription({type:'answer',sdp})}catch(e){if(own===generation)emit('error',e.message)}},
    muteOutput(muted){outputMuted=muted;if(muted){cancelPrepared();resetCaptions()}updatePlayback()}
  };
})();
</script></body></html>
