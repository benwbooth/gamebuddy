<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; media-src blob:; connect-src 'none'"></head><body><audio id="receiver" autoplay muted></audio><script>
(() => {
  let peer=null, mic=null, sender=null, silence=null, audioContext=null, events=null, pendingContext='', generation=0, captureGeneration=0;
  let inputMeter=null,outputMeter=null,meterTimer=null,meterTick=0;
  const receiver=document.getElementById('receiver');
  let outputMuted=false,replyUntil=0,lastReplyAudio=0,assistantDoneAt=0,awaitingAnswer=false;
  let backendBusy=false,playerSpeaking=false,localSpeech=false,pendingOverlapUntil=0,playbackAllowed=false,sessionReady=false;
  let cueWaitingAt=0,cueRetried=false,playedMs=0,replaceQueuedTurn=false,approved=false,approvedTurn=null,queuedSpeech=null,queuedSpeechAt=0,lastIncomingAudio=0;
  let workPending=false,workAnswered=false,workInput='',workRequest=0,workStartedAt=0,workQuietAt=0,workLastCue=0,workUpdates=0,progressCue='';
  let captionParts=[],captionText='',captionFirstMs=null,captionAudioStart=null,captionPending=[],captionGeneration=0;
  function resetCaptions(){captionParts=[];captionText='';captionFirstMs=null;captionAudioStart=null;captionPending=[];captionGeneration++;emit('caption','')}
  function clearWork(){workPending=false;workStartedAt=0;workLastCue=0;workUpdates=0}
  function beginWork(){if(!workPending&&!workAnswered){workPending=true;workStartedAt=Date.now();workUpdates=0;workLastCue=0}}
  function queueSpeech(text){clearWork();workAnswered=true;queuedSpeech=text;queuedSpeechAt=Date.now();emit('reply-pending',true)}
  function approveSpeech(){progressCue='';approved=true;approvedTurn=null;outputMeter?.clear();resetCaptions();allowReply('cue')}
  function sendProgress(text){
    // This independent data channel stays responsive while the reasoning
    // worker waits for tools. Status words never include gameplay advice.
    events.send(JSON.stringify({type:'session.context.append',channel:'speakable',content:[{type:'input_text',text}]}));
    emit('work-progress',workRequest+':'+workUpdates);
  }
  function updateProgress(now){
    if(!workPending||outputMuted||playerSpeaking||!sessionReady||events?.readyState!=='open'
        ||queuedSpeech!==null||assistantTurns.size||approved&&replyUntil>now
        ||now-workStartedAt<2500||now-workQuietAt<2500||now-lastIncomingAudio<500
        ||workLastCue&&now-workLastCue<10000)return;
    const text=workUpdates===0?"I'm on it.":workUpdates===1?"I'm still working on your answer.":"This is taking a little longer. I'm still here.";
    approveSpeech();progressCue=text;workLastCue=now;workUpdates++;
    sendProgress(text);
  }
  function captionsAt(sample,playbackTime){
    if(captionFirstMs===null||captionAudioStart===null)return;
    const ms=captionFirstMs+(sample-captionAudioStart)*1000/audioContext.sampleRate;
    while(captionParts.length&&captionParts[0].start<=ms){
      const part=captionParts.shift();captionText+=part.text;
      captionPending.push({text:captionText,at:playbackTime+(audioContext.outputLatency||0),generation:captionGeneration});
    }
  }
  const assistantTurns=new Set();
  const emit=(type,value)=>console.info('GAMEBUDDY_VOICE '+JSON.stringify({type,value,at:Date.now()}));
  function updatePlayback(){
    const allowed=approved&&!outputMuted&&!playerSpeaking&&replyUntil>Date.now();
    if(allowed!==playbackAllowed){playbackAllowed=allowed;emit('playback-allowed',allowed)}
    return allowed;
  }
  // Frameless voice can generate audio without a player turn. Enforce playback
  // locally: only a completed backend answer or an app cue grants speech. Its
  // native turn completion, not a word-count timer, determines when it ends.
  function allowReply(kind,preserveTurns=false){
    replyUntil=Date.now()+90000;lastReplyAudio=0;assistantDoneAt=0;awaitingAnswer=false;
    if(!preserveTurns)assistantTurns.clear();
    cueWaitingAt=kind==='cue'?Date.now():0;cueRetried=false;
    emit('reply-permit',kind);
    emit('reply-pending',true);
    updatePlayback();
  }
  function playerSpeech(active,recognized=false){
    localSpeech=active;
    // VAD also detects game sounds, breathing and keyboard noise. Only actual
    // recognized words can replace a request or interrupt approved speech.
    // Keep streaming audio so recognition can confirm a short interruption.
    if(active&&!recognized&&!playerSpeaking){pendingOverlapUntil=Date.now()+2500;return}
    if(!active&&!playerSpeaking)return;
    if(active)pendingOverlapUntil=0;
    if(active&&!playerSpeaking){clearWork();workAnswered=false;workInput='';workRequest++;progressCue='';queuedSpeech=null;approved=false;outputMeter?.clear();resetCaptions();replaceQueuedTurn=Date.now()-lastReplyAudio<1000&&playedMs>=400;allowReply('player',!replaceQueuedTurn);playedMs=0}
    if(active!==playerSpeaking)emit('input-active',active);
    playerSpeaking=active;
    if(!active){workQuietAt=Date.now();if(replyUntil)replyUntil=Date.now()+90000}
    updatePlayback();
  }
  function requestFailed(text){clearWork();workAnswered=true;progressCue='';backendBusy=false;queuedSpeech=null;approved=false;replyUntil=0;cueWaitingAt=0;awaitingAnswer=false;outputMeter?.clear();resetCaptions();emit('reply-pending',false);updatePlayback();if(text)emit('request-error',text)}
  function setBackendBusy(active){
    // A handoff may acknowledge the question, pause for tools, then answer.
    // Backend work cannot grant itself permission to start speaking.
    if(backendBusy&&!active&&replyUntil){awaitingAnswer=true;replyUntil=Date.now()+90000}
    backendBusy=active;
  }
  function wire(v){
    emit('wire',{type:v.type,role:v.turn?.role,start_ms:v.start_ms,end_ms:v.end_ms});
    if(v.type==='session.started'){
      sessionReady=true;if(pendingContext)updateContext(pendingContext);emit('ready',true);
    }
    if(v.type==='delegation.created')setBackendBusy(true);

      if(replyUntil)assistantDoneAt=0; // continued words supersede an earlier acknowledgment
      // A short "stop" can end before its transcript arrives. Preserve that
      // recent local overlap so its answer is not silently denied playback.
      if(localSpeech||Date.now()<pendingOverlapUntil){
        const stillSpeaking=localSpeech;pendingOverlapUntil=0;
        playerSpeech(true,true);if(!stillSpeaking)playerSpeech(false);
      }
      emit('input-text',v.item.text);
      // A short stop may be recognized well before its final turn event.
      workInput=(workInput+v.item.text).slice(-8000);
      if(/^(stop(?: talking| speaking)?|be quiet)[.!?\s]*$/i.test(workInput.trim()))clearWork();
      else beginWork();
    }
    if(v.type==='turn.created'&&v.turn?.role==='assistant'){
      if(approved&&approvedTurn!==null&&approvedTurn!==v.turn.id){
        approved=false;outputMeter?.clear();emit('reply-pending',false);updatePlayback();
      }
      if(approved)approvedTurn=v.turn.id;
      if(replaceQueuedTurn){outputMeter?.clear();replaceQueuedTurn=false}
      assistantTurns.add(v.turn.id);assistantDoneAt=0;
    }
    // Audio/text can start before turn.created. A prior backchannel's done
    // event must not close playback in that interval.
    if(v.type==='output_transcript.added'&&approved&&replyUntil){
      assistantDoneAt=0;awaitingAnswer=false;replyUntil=Date.now()+90000;
      if(typeof v.item?.text==='string'&&Number.isFinite(v.start_ms)){
        if(outputMuted){cueWaitingAt=0;captionText+=v.item.text;emit('caption',captionText)}
        else {if(captionFirstMs===null)captionFirstMs=v.start_ms;captionParts.push({start:v.start_ms,text:v.item.text})}
      }
    }
    if(v.type==='turn.done'&&v.turn?.role==='assistant'){
      // Completion of a turn interrupted by a newer request must not close
      // that newer request's playback permission.
      if(assistantTurns.delete(v.turn.id))assistantDoneAt=Date.now();
    }
    if(v.type==='turn.done'&&v.turn?.role==='user'&&mic&&v.turn.transcript?.trim())emit('input-final',v.turn.transcript);
    if(v.type==='turn.done'&&v.turn?.role==='user'&&mic&&/^(stop(?: talking| speaking)?|be quiet)[.!?\s]*$/i.test(v.turn.transcript?.trim()||'')){
      // An exact completed stop command needs no spoken acknowledgment. Wait
      // for completion so "stop ... and show me X" remains a normal request.
      clearWork();workAnswered=true;progressCue='';approved=false;queuedSpeech=null;outputMeter?.clear();resetCaptions();replyUntil=0;cueWaitingAt=0;awaitingAnswer=false;assistantTurns.clear();emit('reply-pending',false);
      updatePlayback();
    }
    if(v.type==='error')emit('error',v.error?.message||'Voice transport error');
  }
  function disconnectMeter(meter){if(meter){meter.source.disconnect();meter.analyser.disconnect();meter.zero.disconnect()}}
  function meter(stream){
    const source=audioContext.createMediaStreamSource(stream),analyser=audioContext.createAnalyser(),zero=audioContext.createGain();
    analyser.fftSize=4096;zero.gain.value=0;source.connect(analyser);analyser.connect(zero);zero.connect(audioContext.destination);
    return {source,analyser,zero,data:new Float32Array(analyser.fftSize)};
  }
  function sampleMeters(){
    const now=Date.now();let rms=0;
    // A late completed backend answer can arrive while the voice model is
    // still generating an unapproved answer. Wait for that turn and its RTP
    // tail to drain before appending the chosen words or opening playback.
    if(queuedSpeech!==null&&!playerSpeaking&&!assistantTurns.size&&now-lastIncomingAudio>=500){
      const text=queuedSpeech;queuedSpeech=null;approveSpeech();emit('speech-ready',text);
    }
    if(queuedSpeech!==null&&!playerSpeaking&&(now-queuedSpeechAt>=6000&&(!approved||now-lastIncomingAudio>=6000)||now-queuedSpeechAt>=90000)){
      // Suppressed speech can stream for minutes. After six seconds, recover
      // the speech connection using the saved answer rather than waiting for
      // those unwanted words to finish. Already approved audio may drain.
      queuedSpeech=null;replyUntil=0;emit('reply-pending',false);emit('cue-timeout',true);
    }
    updateProgress(now);
    while(captionPending.length&&captionPending[0].at<=(audioContext?.currentTime||0)){
      const part=captionPending.shift();if(part.generation===captionGeneration&&approved&&!outputMuted)emit('caption',part.text);
    }
    if(outputMeter){outputMeter.analyser.getFloatTimeDomainData(outputMeter.data);for(const v of outputMeter.data)rms+=v*v;rms=Math.sqrt(rms/outputMeter.data.length)}
    if(replyUntil&&(playerSpeaking||backendBusy&&!progressCue))replyUntil=now+90000;
    // Some new sessions acknowledge an app cue without generating a turn.
    // Retry that exact cue once, only before any speech starts. Never repeat
    // a player request or tool action, or replace an answer already in flight.
    if(cueWaitingAt&&(!backendBusy||progressCue)&&!playerSpeaking){
      if(now-cueWaitingAt>=12000){cueWaitingAt=0;replyUntil=0;emit('reply-pending',false);emit(progressCue?'work-progress-timeout':'cue-timeout',true);progressCue=''}
      else if(now-cueWaitingAt>=6000&&!cueRetried&&!assistantTurns.size){cueRetried=true;if(progressCue){if(workPending&&queuedSpeech===null)sendProgress(progressCue)}else emit('cue-retry',true)}
    }
    if(replyUntil&&(now>=replyUntil||((!backendBusy||progressCue)&&(!awaitingAnswer||progressCue)&&!playerSpeaking&&!assistantTurns.size&&assistantDoneAt&&(lastReplyAudio||outputMuted)&&now-assistantDoneAt>=500&&now-lastReplyAudio>=500))){replyUntil=0;progressCue='';emit('reply-pending',false)}
    const allowed=updatePlayback();
    const audible=allowed&&rms>0.002;
    if(audible){playedMs+=20;lastReplyAudio=now;awaitingAnswer=false;replyUntil=now+90000;cueWaitingAt=0}
    // Chromium's acoustic echo cancellation processes the microphone before
    // this meter and the sender. Keep it live so a player can interrupt speech.
    if(inputMeter){
      inputMeter.analyser.getFloatTimeDomainData(inputMeter.data);
      // Send a 20 ms, 16 kHz PCM slice to the existing Rust/WebRTC speech
      // detector. The Qt console handler consumes this local IPC message;
      // activity samples are not written to audio files or application traces.
      const data=inputMeter.data,ratio=audioContext.sampleRate/16000,start=data.length-Math.ceil(320*ratio),pcm=[];
      for(let i=0;i<320;i++){
        const from=start+Math.floor(i*ratio),to=start+Math.max(Math.floor((i+1)*ratio),Math.floor(i*ratio)+1);
        let sum=0;for(let j=from;j<to;j++)sum+=data[j]||0;
        pcm.push(Math.round(Math.max(-1,Math.min(1,sum/(to-from)))*32767));
      }
      emit('input-pcm',pcm);
    }
    if(++meterTick%5===0)emit('output-active',audible);
    const own=generation;
    if(meterTick%250===0&&peer)peer.getStats().then(stats=>{
      if(own!==generation)return;
      const summary=[];stats.forEach(s=>{if((s.type==='inbound-rtp'||s.type==='outbound-rtp')&&s.kind==='audio')summary.push({type:s.type,packets:s.packetsSent??s.packetsReceived,bytes:s.bytesSent??s.bytesReceived,concealed:s.concealedSamples,jitterDelay:s.jitterBufferDelay,jitterEmitted:s.jitterBufferEmittedCount})});emit('transport-stats',summary);
    }).catch(()=>{});
  }
  function closeMic(){captureGeneration++;pendingOverlapUntil=0;disconnectMeter(inputMeter);inputMeter=null;if(mic)mic.getTracks().forEach(t=>t.stop());mic=null;if(sender)sender.replaceTrack(silence).catch(()=>{});emit('capture',false)}
  function disconnectOutput(){if(outputMeter?.processor){outputMeter.processor.onaudioprocess=null;outputMeter.processor.disconnect()}disconnectMeter(outputMeter);outputMeter=null;receiver.srcObject=null}
  function stop(){generation++;clearWork();progressCue='';workQuietAt=0;queuedSpeech=null;lastIncomingAudio=0;approved=false;resetCaptions();clearInterval(meterTimer);meterTimer=null;closeMic();disconnectOutput();replyUntil=0;lastReplyAudio=0;playedMs=0;replaceQueuedTurn=false;assistantDoneAt=0;awaitingAnswer=false;cueWaitingAt=0;cueRetried=false;assistantTurns.clear();backendBusy=false;playerSpeaking=false;localSpeech=false;pendingOverlapUntil=0;updatePlayback();sessionReady=false;emit('output-active',false);if(peer)peer.close();peer=null;sender=null;events=null;pendingContext='';if(silence)silence.stop();silence=null;if(audioContext)audioContext.close().catch(()=>{});audioContext=null;receiver.srcObject=null}
  function updateContext(text){
    pendingContext=text;
    if(events?.readyState!=='open'||!sessionReady)return;
    // Frameless v3 appendText defaults to speakable even for developer messages.
    // Observations must use the quiet commentary channel on the same WebRTC session.
    // Match Codex's 500-byte context chunks without splitting a Unicode character.
    const encoder=new TextEncoder();let chunk='',bytes=0;
    const send=text=>events.send(JSON.stringify({type:'session.context.append',channel:'commentary',content:[{type:'input_text',text}]}));
    for(const char of pendingContext){const size=encoder.encode(char).length;if(bytes+size>500){send(chunk);chunk='';bytes=0}chunk+=char;bytes+=size}
    if(chunk)send(chunk);
    pendingContext='';
  }
  async function setMicrophone(enabled,deviceName){
    closeMic();if(!enabled||!peer)return;
    const own=generation,request=captureGeneration,stale=()=>own!==generation||request!==captureGeneration;
    let stream=null;
    const constraints={echoCancellation:true,noiseSuppression:true,autoGainControl:true};
    try {
      stream=await navigator.mediaDevices.getUserMedia({audio:constraints,video:false});
      if(stale()){stream.getTracks().forEach(t=>t.stop());return}
      if(deviceName){
        const devices=await navigator.mediaDevices.enumerateDevices();
        if(stale()){stream.getTracks().forEach(t=>t.stop());return}
        const selected=devices.find(d=>d.kind==='audioinput' && (d.label===deviceName || d.label.endsWith(deviceName)));
        if(!selected)throw Error('Selected microphone is unavailable to the voice engine');
        stream.getTracks().forEach(t=>t.stop());
        stream=await navigator.mediaDevices.getUserMedia({audio:{...constraints,deviceId:{exact:selected.deviceId}},video:false});
        if(stale()){stream.getTracks().forEach(t=>t.stop());return}
      }
      mic=stream;
      mic.getAudioTracks().forEach(t=>t.enabled=true);
      await sender.replaceTrack(stream.getAudioTracks()[0]);
      if(!stale()){inputMeter=meter(stream);emit('capture',true)}
    }catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());if(!stale()){closeMic();emit('microphone-error',e.name+': '+e.message)}}
  }
  window.gamebuddyVoice={requestFailed,stop,setMicrophone,updateContext,allowReply,approveSpeech,queueSpeech,playerSpeech,setBackendBusy,
    async start(deviceName,capture=false){
      stop();const own=generation;let stage='peer connection';
      try {
        const pc=new RTCPeerConnection();peer=pc;
        // Negotiate duplex audio without opening a microphone. Explicit activation
        // attaches a track later; muting closes it while guidance remains audible.
        sender=pc.addTransceiver('audio',{direction:'sendrecv'}).sender;
        // Frameless voice advances on incoming audio frames. A zero-valued local
        // track supplies that clock without touching any microphone or device.
        const audio=new AudioContext();audioContext=audio;
        const output=audio.createMediaStreamDestination(),zero=audio.createConstantSource();
        zero.offset.value=0;zero.connect(output);zero.start();
        silence=output.stream.getAudioTracks()[0];await sender.replaceTrack(silence);await audio.resume();
        if(own!==generation)return;
        meterTimer=setInterval(sampleMeters,20);
        events=pc.createDataChannel('oai-events');
        events.onmessage=e=>{if(own!==generation)return;try{wire(JSON.parse(e.data))}catch{}};
        pc.ontrack=e=>{
          if(own!==generation)return;
          const stream=e.streams[0]||new MediaStream([e.track]);disconnectOutput();
          // Retain the onset while the local speech detector releases its
          // final 200 ms; the queue also holds longer overlap with player speech.
          if(e.receiver && 'jitterBufferTarget' in e.receiver){e.receiver.jitterBufferTarget=300;emit('playout-buffer',300)}
          const source=audio.createMediaStreamSource(stream),processor=audio.createScriptProcessor(1024,1,1),analyser=audio.createAnalyser(),gain=audio.createGain();
          analyser.fftSize=4096;
          const samples=new Float32Array(audio.sampleRate*30),sampleTimes=new Float64Array(samples.length),preRoll=new Float32Array(Math.ceil(audio.sampleRate*0.2));
          let read=0,size=0,preAt=0,preSize=0,quietSamples=0,inputSample=0;
          const clear=()=>{read=0;size=0;preAt=0;preSize=0;quietSamples=0};
          const append=(value,at)=>{if(size===samples.length){read=(read+1)%samples.length;size--}const index=(read+size)%samples.length;samples[index]=value;sampleTimes[index]=at;size++};
          processor.onaudioprocess=event=>{
            const input=event.inputBuffer.getChannelData(0),output=event.outputBuffer.getChannelData(0);
            output.fill(0);
            const blockStart=inputSample;inputSample+=input.length;
            let energy=0;for(const value of input)energy+=value*value;
            const speaking=energy/input.length>0.000004;
            if(speaking)lastIncomingAudio=Date.now();
            if(!approved||outputMuted||replyUntil<=Date.now()){clear();return}
            if(speaking&&captionAudioStart===null)captionAudioStart=blockStart;
            // Do not queue seconds of transport silence/comfort noise while
            // the player talks. Keep pre-roll for quiet consonant onsets.
            const waiting=!size&&!speaking || playerSpeaking&&!speaking&&quietSamples>=preRoll.length;
            if(waiting){for(const value of input){preRoll[preAt]=value;preAt=(preAt+1)%preRoll.length;preSize=Math.min(preRoll.length,preSize+1)}}
            else {
              for(let i=0;i<preSize;i++)append(preRoll[(preAt-preSize+i+preRoll.length)%preRoll.length],blockStart-preSize+i);preSize=0;
              for(let i=0;i<input.length;i++)append(input[i],blockStart+i);
              quietSamples=speaking?0:quietSamples+input.length;
            }
            if(!playerSpeaking){for(let i=0;i<output.length&&size;i++){output[i]=samples[read];captionsAt(sampleTimes[read],(event.playbackTime||audio.currentTime||0)+i/audio.sampleRate);read=(read+1)%samples.length;size--}}
          };
          source.connect(processor);processor.connect(analyser);analyser.connect(gain);gain.connect(audio.destination);
          outputMeter={source,processor,analyser,zero:gain,clear,data:new Float32Array(analyser.fftSize)};
          // Chromium needs an HTML consumer to keep the remote track decoded.
          // Playback itself uses the queue so speech during input is retained.
          receiver.srcObject=stream;receiver.muted=true;updatePlayback();
          receiver.play().catch(err=>{if(own===generation)emit('error',err.message)});
        };
        pc.onconnectionstatechange=()=>{if(own===generation)emit('connection',pc.connectionState)};
        if(capture)await setMicrophone(true,deviceName);
        if(own!==generation)return;
        stage='SDP offer';await pc.setLocalDescription(await pc.createOffer());
        if(pc.iceGatheringState!=='complete')await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error('Voice connection setup timed out')),10000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(timeout);resolve()}})});
        if(own===generation)emit('offer',pc.localDescription.sdp);
      }catch(e){if(own===generation){stop();emit('error',stage+': '+e.name+': '+e.message)}}
    },
    async answer(sdp){const pc=peer,own=generation;try{if(pc)await pc.setRemoteDescription({type:'answer',sdp})}catch(e){if(own===generation)emit('error',e.message)}},
    muteOutput(muted){outputMuted=muted;if(muted)resetCaptions();updatePlayback()}
  };
})();
</script></body></html>
